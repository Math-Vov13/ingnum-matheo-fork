version: '3.8'

services:
  customer-service:
    build:
      context: ./api-project
      dockerfile: Dockerfile
    container_name: customer-service
    ports:
      - "8081:8000"
    networks:
      - microservices-network
    restart: unless-stopped
    depends_on:
      - rental-mysql

  rental-service:
    build:
      context: ./RentalService
      dockerfile: Dockerfile
    container_name: rental-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=rental-service
      - SERVER_PORT=8080
      - CUSTOMER_SERVICE_URL=http://customer-service:8000
    networks:
      - microservices-network
    depends_on:
      - customer-service
      - rental-mysql
    restart: unless-stopped

  rental-mysql:
    image: mysql:8.0
    container_name: rental-mysql
    environment:
      MYSQL_DATABASE: rentaldb
      MYSQL_USER: rental_user
      MYSQL_PASSWORD: rental_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - rental-mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge

volumes:
  rental-mysql-data:
    driver: local